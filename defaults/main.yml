# SPDX-License-Identifier: MIT
---
# defaults file for plakar
plakar_version: "latest"
plakar_release_url: "https://github.com/PlakarKorp/plakar/releases"
plakar_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
plakar_download_dir: "/tmp"
plakar_klosets: []
plakar_sources: []
plakar_user: "plakar"
plakar_group: "plakar"
plakar_uid: null
plakar_gid: null
plakar_home: "/var/lib/plakar"
plakar_config_dir: "{{ plakar_home }}/.config/plakar"
plakar_ignore_dir: "/etc/plakar/ignore"
plakar_libexec_dir: "/usr/local/libexec/plakar"
plakar_generate_ssh_key: false
plakar_known_hosts: []
plakar_token: ""
plakar_plugins: []
plakar_backup_schedule: "daily"
plakar_check_schedule: "weekly"
